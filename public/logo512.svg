<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Symbol Glow & Highlights -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas (512x512 with standard 20% squircle radius) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Glowing Lens Ring -->
  <circle cx="256" cy="236" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4" />

  <!-- Main Symbol: Modern Graduation Cap & Open AI Book -->
  <g filter="url(#dropShadow)">
    <!-- Graduation Cap Diamond -->
    <polygon points="256,120 370,175 256,230 142,175" fill="url(#iconGrad)" />
    
    <!-- Cap Neck/Base -->
    <path d="M 180,195 L 180,225 C 180,250 332,250 332,225 L 332,195" fill="none" stroke="url(#iconGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Tassel -->
    <path d="M 345,188 L 365,245" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
    <circle cx="365" cy="252" r="8" fill="#FDE047" />

    <!-- Open Book / AI Lens Wings -->
    <path d="M 152,280 Q 256,305 256,365 Q 256,305 360,280 V 350 Q 256,375 256,420 Q 256,375 152,350 Z" fill="url(#iconGrad)" opacity="0.95" />
  </g>

  <!-- Dynamic AI Sparkle Dots -->
  <circle cx="125" cy="130" r="10" fill="#38BDF8" opacity="0.9" />
  <circle cx="390" cy="330" r="7" fill="#FDE047" opacity="0.8" />
</svg>
